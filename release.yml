name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-executables:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: spatial-sound-windows.exe
          - os: macos-latest
            name: spatial-sound-macos
          - os: ubuntu-latest
            name: spatial-sound-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt pyinstaller
      - name: Test
        shell: bash
        run: python tests/test_spatial.py
      - name: Build executable
        shell: bash
        run: pyinstaller --onefile --name spatial-sound app.py
      - name: Rename artifact
        shell: bash
        run: |
          src=$(ls dist/spatial-sound*)
          cp "$src" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  publish:
    needs: [build-executables, build-package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          body_path: CHANGELOG.md
